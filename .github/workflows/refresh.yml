name: Refresh Maui Jim US feed

on:
  # Main schedule: cron-job.org starts runs at 6:17am and 6:17pm Brisbane.
  # Backup: GitHub's own schedule at 8:17am / 8:17pm Brisbane (UTC 22:17 / 10:17). It skips itself
  # if a run already happened in the last 6 hours, so it only does work when cron-job.org didn't.
  schedule:
    - cron: '17 22,10 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only scrape this many products (0 = all). For testing.'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape and compare
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          SKIP_IF_RECENT_HOURS: ${{ github.event_name == 'schedule' && '6' || '0' }}
          # Required: the site blocks GitHub's servers, so pages go through a scraping service.
          # Set LITESCRAPE_API_KEY (preferred) or SCRAPER_URL_TEMPLATE as a repo secret.
          SCRAPER_URL_TEMPLATE: ${{ secrets.SCRAPER_URL_TEMPLATE }}
          LITESCRAPE_API_KEY: ${{ secrets.LITESCRAPE_API_KEY }}
        run: node src/run.mjs
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "maui-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Feed refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Code may have changed during the run: replay our data commit on top, then push.
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maui-jim-feed
          path: data/
          retention-days: 14
